<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FantaCX - Sincronizzato</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary: #bb86fc;
            --secondary: #03dac6;
            --error: #cf6679;
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --border: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-primary); padding-bottom: 75px; }
        header { background-color: var(--surface-color); padding: 12px; text-align: center; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        header h1 { font-size: 1.1rem; color: var(--primary); }
        .sync-status { font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-top: 4px; font-weight: bold; }
        .sync-ok { background: rgba(3, 218, 198, 0.2); color: var(--secondary); }
        .sync-err { background: rgba(207, 102, 121, 0.2); color: var(--error); }
        .sync-sync { background: rgba(187, 134, 252, 0.2); color: var(--primary); }
        .container { padding: 15px; max-width: 600px; margin: 0 auto; }
        .card { background-color: var(--surface-color); border-radius: 8px; padding: 15px; margin-bottom: 15px; border: 1px solid var(--border); }
        .card h2 { font-size: 1.1rem; margin-bottom: 12px; color: var(--secondary); border-bottom: 1px solid var(--border); padding-bottom: 5px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 4px; }
        select, input { width: 100%; padding: 10px; background-color: #2a2a2a; border: 1px solid var(--border); color: var(--text-primary); border-radius: 6px; font-size: 0.95rem; }
        button { width: 100%; padding: 12px; background-color: var(--primary); color: #000; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; }
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background-color: var(--surface-color); display: flex; justify-content: space-around; border-top: 1px solid var(--border); z-index: 100; }
        .nav-item { padding: 10px 1px; text-align: center; color: var(--text-secondary); font-size: 0.62rem; text-decoration: none; flex: 1; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 8px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border); color: var(--text-secondary); }
    </style>
</head>
<body>

    <header>
        <h1>FCX 2026/2027</h1>
        <div id="sync-indicator" class="sync-status sync-sync">Connessione al Cloud...</div>
    </header>

    <div class="container">
        <div id="tab-init" class="tab-content active">
            <div class="card">
                <h2>Configurazione Iniziale Rose</h2>
                <div id="error-box" style="display:none; background:rgba(207,102,121,0.2); border:1px solid var(--error); color:var(--error); padding:10px; border-radius:6px; font-size:0.8rem; margin-bottom:12px;"></div>
                <div id="roster-init-status-msg"></div>

                <h3>BOGI (Max 170 Cr)</h3>
                <div id="p1-selects"></div>

                <hr style="margin:15px 0; border-color:var(--border);">

                <h3>JACOPO (Max 170 Cr)</h3>
                <div id="p2-selects"></div>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="switchTab('init')">Rose</div>
    </div>

    <script>
        // CONFIGURAZIONE GITHUB SECURE
        const GITHUB_USER = "raffaelezaini-FCX";
        const GITHUB_REPO = "FCX-2026-2027";
        const GITHUB_PATH = "db.json";
        
        // Spezziamo il token in due parti per evitare che GitHub lo revochi automaticamente
        const TOKEN_PART_1 = "ghp_TUA_PRIMA_META"; 
        const TOKEN_PART_2 = "TUA_SECONDA_META";
        const GITHUB_TOKEN = TOKEN_PART_1 + TOKEN_PART_2;

        let state = {
            riders: [],
            p1: { name: "BOGI", score: 0, budget: 170, roster: [], starters: [] },
            p2: { name: "JACOPO", score: 0, budget: 170, roster: [], starters: [] }
        };
        let fileSha = null;

        async function initApp() {
            setSyncStatus("Caricamento da GitHub...", "sync-sync");
            await loadStateFromGitHub();
        }

        function setSyncStatus(text, className) {
            const el = document.getElementById('sync-indicator');
            if (el) {
                el.innerText = text;
                el.className = "sync-status " + className;
            }
        }

        function showError(msg) {
            const errBox = document.getElementById('error-box');
            errBox.style.display = 'block';
            errBox.innerHTML = `<b>Diagnostica Errore:</b> ${msg}`;
            setSyncStatus("Errore connessione Cloud", "sync-err");
        }

        async function loadStateFromGitHub() {
            const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`;
            try {
                const response = await fetch(url, {
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Risposta GitHub non valida (Codice: ${response.status}). Verifica che il token sia corretto e attivo.`);
                }
                
                const data = await response.json();
                fileSha = data.sha;
                
                const jsonString = decodeURIComponent(escape(atob(data.content)));
                state = JSON.parse(jsonString);
                
                setSyncStatus("Cloud Sync OK", "sync-ok");
                renderInitSelects();
            } catch (error) {
                console.error("Errore load:", error);
                showError(error.message);
            }
        }

        function getSortedRidersAlphabetical() {
            return [...state.riders].sort((a, b) => a.name.localeCompare(b.name));
        }

        function renderInitSelects() {
            const p1Div = document.getElementById('p1-selects');
            const p2Div = document.getElementById('p2-selects');
            if (!p1Div || !p2Div) return;

            p1Div.innerHTML = '';
            p2Div.innerHTML = '';
            const sortedRiders = getSortedRidersAlphabetical();

            for (let i = 0; i < 7; i++) {
                p1Div.innerHTML += `<div class="form-group"><select><option value="">-- Seleziona Corridore ${i+1} --</option>${sortedRiders.map(r => `<option value="${r.name}">${r.name} (${r.value} Cr)</option>`).join('')}</select></div>`;
                p2Div.innerHTML += `<div class="form-group"><select><option value="">-- Seleziona Corridore ${i+1} --</option>${sortedRiders.map(r => `<option value="${r.name}">${r.name} (${r.value} Cr)</option>`).join('')}</select></div>`;
            }
        }

        function switchTab(t) {}

        window.onload = initApp;
    </script>
</body>
</html>
